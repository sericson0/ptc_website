<!DOCTYPE html>
<!--
  PTC Class Library — the main page, embedded in the Google Site.

  WHERE THINGS LIVE
    lessons/*.js        one file per group of lessons — this is what you edit
    assets/theme.js     colors, fonts, light/dark
    assets/library.css  styling
    assets/library.js   the code that draws the page (no edits needed)

  TO ADD A GROUP OF LESSONS
    1. Copy lessons/_TEMPLATE.js to lessons/04-something.js and fill it in.
    2. Add one <script> line for it in the list below.
       The order of that list is the order the groups appear on the page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTC Class Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/library.css">
<script src="assets/theme.js"></script>
<script defer src="assets/library.js"></script>

<!-- ======= THE GROUPS OF LESSONS ON THIS PAGE, in order ======= -->
<script defer src="lessons/01-embrace-and-box-step.js"></script>
<script defer src="lessons/02-basic-8.js"></script>
<script defer src="lessons/03-extra-resources.js"></script>
<!-- ============================================================ -->
</head>
<body>
<!--
  No page heading here on purpose: the Google Site supplies the heading
  above the embed. The page draws itself into #index and #units.
-->
<div class="wrap">
  <header class="head">
    <div class="tools">
      <label class="search">
        <span class="sr" hidden>Search lessons</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search lessons and materials" autocomplete="off">
      </label>
      <button class="btn" id="expand-all" type="button">Expand all</button>
      <button class="btn" id="collapse-all" type="button">Collapse all</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <nav class="index" aria-label="Units">
      <h2>Units</h2>
      <ol id="index"></ol>
      <p class="count" id="count"></p>
    </nav>
    <main class="units" id="units"></main>
  </div>
</div>
</body>
</html>
