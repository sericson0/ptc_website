const slide = document.getElementById('slide');
const media = document.getElementById('media');
let video = document.getElementById('video');
const play = document.getElementById('play');
const counter = document.getElementById('counter');
let index = 0;
function show(next) {
  if (!Number.isInteger(next) || next < 0 || next >= slides.length) return;
  media.hidden = true;
  play.hidden = true;
  video.pause();
  video.removeAttribute('src');
  video.load();
  // A fresh element prevents queued events from a previous movie from
  // revealing it on a later slide or hiding the new slide's play button.
  const nextVideo = video.cloneNode(false);
  video.replaceWith(nextVideo);
  video = nextVideo;
  video.autoplay = false;
  video.muted = false;
  video.style.visibility = 'hidden';
  index = next;
  const item = slides[index];
  slide.src = item.image;
  slide.alt = `${item.title}, page ${index + 1} of ${slides.length}`;
  counter.textContent = `${index + 1} / ${slides.length}`;
  document.getElementById('previous').disabled = index === 0;
  document.getElementById('next').disabled = index === slides.length - 1;
  media.hidden = !item.movie;
  if (item.movie) {
    for (const key of ['left', 'top', 'width', 'height']) media.style[key] = item.movie[key] + '%';
    video.autoplay = Boolean(item.movie.autoplay);
    video.muted = video.autoplay;
    video.src = item.movie.src;
    play.hidden = false;
    nextVideo.addEventListener('play', () => {
      if (video !== nextVideo) return;
      video.style.visibility = 'visible';
      play.hidden = true;
    });
    if (video.autoplay) {
      nextVideo.play().catch(() => {
        if (video === nextVideo) play.hidden = false;
      });
    }
  }
  history.replaceState(null, '', '#' + (index + 1));
}
play.addEventListener('click', async () => {
  const activeVideo = video;
  try {
    await activeVideo.play();
    if (video === activeVideo) play.hidden = true;
  }
  catch (error) {
    if (video === activeVideo) alert('Unable to play this video. Keep the videos folder beside presentation.html.');
  }
});
slide.addEventListener('click', () => show(index + 1));
document.getElementById('previous').addEventListener('click', () => show(index - 1));
document.getElementById('next').addEventListener('click', () => show(index + 1));
document.getElementById('fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.body.requestFullscreen();
});
function showFromHash() {
  const page = Number(location.hash.slice(1) || 1);
  show(Number.isInteger(page) ? Math.max(0, Math.min(slides.length - 1, page - 1)) : 0);
}
window.addEventListener('hashchange', showFromHash);
document.addEventListener('keydown', event => {
  if (event.target === video || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); show(index + 1); }
  if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); show(index - 1); }
});
showFromHash();
